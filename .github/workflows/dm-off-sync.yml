name: sync-dm-off

# 追 upstream sunnypilot/dev，套用「關閉 DM 分心警示」的 patch，產出 dm-off 分支。
# Track upstream sunnypilot/dev, apply the DM-nag-disable patch, publish branch dm-off.
#
# 完全走 GitHub API，不 clone（上游 repo 5.2 GB）。因為本 repo 是 sunnypilot 的 fork，
# 兩邊共用物件庫，所以「把樹指過來 + 換一個檔案」是零流量操作。
# Pure GitHub API, no clone. Works because this repo is a fork sharing objects with upstream.

on:
  schedule:
    - cron: '*/30 * * * *'   # 每 30 分鐘 / every 30 min (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只檢查不推送 / check only, do not push'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-dm-off
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OURS: ${{ github.repository }}
      UPSTREAM_REPO: sunnypilot/sunnypilot
      UPSTREAM_BRANCH: dev
      OUTPUT_BRANCH: dm-off
      TARGET_FILE: openpilot/selfdrive/monitoring/policy.py
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Mirror upstream + apply DM-off patch
        shell: python {0}
        run: |
          import base64, json, os, re, sys, urllib.request, urllib.error

          TOKEN      = os.environ["GH_TOKEN"]
          OURS       = os.environ["OURS"]
          UPSTREAM   = os.environ["UPSTREAM_REPO"]
          UP_BRANCH  = os.environ["UPSTREAM_BRANCH"]
          OUT_BRANCH = os.environ["OUTPUT_BRANCH"]
          TARGET     = os.environ["TARGET_FILE"]
          DRY_RUN    = os.environ.get("DRY_RUN", "false").lower() == "true"
          API        = "https://api.github.com"

          summary = []
          def note(msg):
              print(msg, flush=True)
              summary.append(msg)

          def die(msg):
              note(f"::error::{msg}")
              _flush_summary()
              sys.exit(1)

          def _flush_summary():
              path = os.environ.get("GITHUB_STEP_SUMMARY")
              if path:
                  with open(path, "a", encoding="utf-8") as f:
                      f.write("\n".join(summary) + "\n")

          def api(method, path, body=None):
              url = path if path.startswith("http") else API + path
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header("Authorization", f"Bearer {TOKEN}")
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              if data is not None:
                  req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      raw = r.read()
                      return r.status, (json.loads(raw) if raw else None)
              except urllib.error.HTTPError as e:
                  raw = e.read()
                  try:
                      return e.code, json.loads(raw) if raw else None
                  except Exception:
                      return e.code, {"raw": raw[:500].decode("utf-8", "replace")}

          # --- patch 定義：唯一的真實來源 / the single source of truth for the patch ---
          # 關掉 awareness 扣分的唯一入口 → 分心/瞌睡警示與 noResponseForceDecel 全部不觸發
          PATTERN = re.compile(r"^([ \t]*)if certainly_distracted or maybe_distracted:[ \t]*$", re.M)
          REPL    = r"\1if False and (certainly_distracted or maybe_distracted):  # DM-OFF patch"
          MARKER  = "if False and (certainly_distracted or maybe_distracted):"

          def apply_patch(src: str) -> str:
              n = len(PATTERN.findall(src))
              if n != 1:
                  die(f"patch 目標在上游變了：預期 1 處符合，實際 {n} 處。"
                      f"上游可能重構了 {TARGET}，需要人工重寫 patch。"
                      f"（本次不推送，dm-off 維持在上一版，車機不受影響）")
              out = PATTERN.sub(REPL, src, count=1)
              if MARKER not in out:
                  die("套用後找不到 marker，patch 邏輯有問題")
              try:
                  compile(out, TARGET, "exec")
              except SyntaxError as e:
                  die(f"套用後語法檢查失敗：{e}")
              return out

          # --- 1. 上游最新 commit ---
          st, ref = api("GET", f"/repos/{UPSTREAM}/git/ref/heads/{UP_BRANCH}")
          if st != 200:
              die(f"讀不到上游 {UPSTREAM}@{UP_BRANCH}: HTTP {st} {ref}")
          up_sha = ref["object"]["sha"]
          note(f"上游 {UPSTREAM}@{UP_BRANCH} = `{up_sha[:8]}`")

          TRAILER = f"upstream-commit: {up_sha}"

          # --- 2. 已經處理過就跳過（冪等）---
          st, cur = api("GET", f"/repos/{OURS}/commits/{OUT_BRANCH}")
          if st == 200 and TRAILER in (cur.get("commit", {}).get("message") or ""):
              note(f"`{OUT_BRANCH}` 已經是這版上游的 patch 版本，無事可做。")
              _flush_summary()
              sys.exit(0)
          if st == 200:
              note(f"目前 `{OUT_BRANCH}` = `{cur['sha'][:8]}`，需要更新")
          else:
              note(f"`{OUT_BRANCH}` 尚不存在，將建立")

          # --- 3. 上游 commit 的 tree ---
          st, upc = api("GET", f"/repos/{UPSTREAM}/git/commits/{up_sha}")
          if st != 200:
              die(f"讀不到上游 commit 物件: HTTP {st} {upc}")
          base_tree = upc["tree"]["sha"]

          # --- 4. 取原始檔並套 patch ---
          st, blob = api("GET", f"/repos/{UPSTREAM}/contents/{TARGET}?ref={up_sha}")
          if st != 200:
              die(f"讀不到 {TARGET}: HTTP {st} {blob}")
          src = base64.b64decode(blob["content"]).decode("utf-8")
          patched = apply_patch(src)
          line_no = patched.split("\n").index(
              next(l for l in patched.split("\n") if MARKER in l)) + 1
          note(f"patch 套用成功，位置第 {line_no} 行；語法檢查通過")

          if DRY_RUN:
              note("DRY RUN：到此為止，不推送。")
              _flush_summary()
              sys.exit(0)

          # --- 5. 寫 blob / tree / commit 到我們的 repo（同 fork network，零流量）---
          st, nb = api("POST", f"/repos/{OURS}/git/blobs", {
              "content": base64.b64encode(patched.encode()).decode(), "encoding": "base64"})
          if st not in (200, 201):
              die(f"建立 blob 失敗: HTTP {st} {nb}")

          st, nt = api("POST", f"/repos/{OURS}/git/trees", {
              "base_tree": base_tree,
              "tree": [{"path": TARGET, "mode": "100644", "type": "blob", "sha": nb["sha"]}]})
          if st not in (200, 201):
              die(f"建立 tree 失敗: HTTP {st} {nt}。"
                  f"若訊息是找不到 base_tree，代表本 repo 不是 {UPSTREAM} 的 fork（物件庫沒共用），"
                  f"必須改用 clone 版流程。")

          msg = (f"DM-off patch on {UP_BRANCH}\n\n"
                 f"Auto-generated. Upstream tree untouched except {TARGET}.\n"
                 f"{TRAILER}\n")
          st, nc = api("POST", f"/repos/{OURS}/git/commits",
                       {"message": msg, "tree": nt["sha"], "parents": [up_sha]})
          if st not in (200, 201):
              die(f"建立 commit 失敗: HTTP {st} {nc}")
          new_sha = nc["sha"]

          # --- 6. 更新分支（force：上游會改寫歷史，車機是 checkout --force -B，無所謂）---
          st, r = api("PATCH", f"/repos/{OURS}/git/refs/heads/{OUT_BRANCH}",
                      {"sha": new_sha, "force": True})
          if st == 422 or st == 404:
              st, r = api("POST", f"/repos/{OURS}/git/refs",
                          {"ref": f"refs/heads/{OUT_BRANCH}", "sha": new_sha})
          if st not in (200, 201):
              die(f"更新分支失敗: HTTP {st} {r}")

          # --- 7. 回頭跟伺服器驗收（不信任本地變數）---
          st, chk = api("GET", f"/repos/{OURS}/contents/{TARGET}?ref={OUT_BRANCH}")
          if st != 200:
              die(f"驗收讀取失敗: HTTP {st} {chk}")
          final = base64.b64decode(chk["content"]).decode("utf-8")
          if MARKER not in final:
              die("驗收失敗：推上去的檔案裡沒有 patch！")
          if re.search(r"^[ \t]*if certainly_distracted or maybe_distracted:", final, re.M):
              die("驗收失敗：原始的分心判斷還在！")

          note(f"✅ `{OUT_BRANCH}` 已更新為 `{new_sha[:8]}`（上游 `{up_sha[:8]}` + DM-off patch），伺服器端驗收通過")
          _flush_summary()
